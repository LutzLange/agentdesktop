# yaml-language-server: $schema=https://agentgateway.dev/schema/config
frontendPolicies:
  logging:
    add:
      oauth.client: jwt.aud
      user: jwt.email

gateways:
  gateway:
    port: 4001

routes:
- name: reachability
  gateways: gateway
  matches:
  - method: HEAD
    path:
      exact: /
  policies:
    directResponse:
      status: 200

llm:
  gateways: gateway
  policies:
    jwtAuth:
      mode: strict
      issuer: http://127.0.0.1:5557/dex
      audiences: [agentdesktop-local]
      jwks:
        url: http://localhost:5557/dex/keys
    transformations:
      request:
        set:
          authorization: |
            "Bearer " + request.headers['x-llm-token']
  models:
  # Claude desktop requires an explicit model
  - name: "gpt-6-luna"
    provider: copilot
    params:
      model: gpt-5.6-luna
    requestHeaders:
      set:
        copilot-integration-id: copilot-developer-cli
    auth:
      credentials: []