# yaml-language-server: $schema=../../schema/daemon-config.json
llmGateway:
  url: http://127.0.0.1:4001
  authentication:
    type: oidc
    issuer: http://127.0.0.1:5557/dex
    clientId: agentdesktop-local
    scopes: [openid, email, offline_access]
    allowInsecure: true
  githubOAuth:
    # Replace with your GitHub App's Client ID (not its numeric App ID).
    # Enable Device Flow in the App settings; no callback URL is needed.
    clientId: Iv23liJrjLXp6bL3WUCC

# Optional loopback proxy for clients without an API-key helper (see README, "Local LLM proxy").
# daemon:
#   llmProxy:
#     listen: 127.0.0.1:4000

programs: {}
